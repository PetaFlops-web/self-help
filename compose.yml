services:
  backend-init:
    build: ./backend
    container_name: backend_init_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/db_wia
      - REDIS_URL=redis://redis:6379
      - LLM_SERVICE_URL=http://llm:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm run migrate up && npm run seed"
    restart: "no"

  backend:
    build: ./backend
    container_name: backend_app_self-help
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/db_wia
      - REDIS_URL=redis://redis:6379
      - LLM_SERVICE_URL=http://llm:3001
    depends_on:
      backend-init:
        condition: service_completed_successfully
      llm:
        condition: service_started

  llm:
    build: ./llm-service
    container_name: ml_service_self-help
    ports:
      - "3001:3001"
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3001

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: frontend_app_self-help
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    container_name: db_wialmb
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: db_wia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db_wia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    container_name: redis_wialmb
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: