services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy_self-help
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: always

  certbot:
    image: certbot/certbot
    container_name: certbot_self-help
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  backend-init:
    build: ./backend
    container_name: backend_init_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://root:${POSTGRES_PASSWORD:-rootpassword}@db:5432/db_wia
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - LLM_SERVICE_URL=http://llm:3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npm run migrate up && npm run seed"
    restart: "no"

  backend:
    build: ./backend
    container_name: backend_app_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=postgresql://root:${POSTGRES_PASSWORD:-rootpassword}@db:5432/db_wia
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - LLM_SERVICE_URL=http://llm:3001
      - ALLOWED_ORIGINS=https://bordrex.my.id,http://bordrex.my.id
    depends_on:
      backend-init:
        condition: service_completed_successfully
      llm:
        condition: service_started

  llm:
    build: ./llm-service
    container_name: ml_service_self-help
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://bordrex.my.id/api
    container_name: frontend_app_self-help
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    container_name: db_wialmb
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: db_wia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db_wia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    container_name: redis_wialmb
    restart: always
    command: sh -c "redis-server --requirepass $${REDIS_PASSWORD:-}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"

volumes:
  pgdata:
  certbot-conf:
  certbot-www: