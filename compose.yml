services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy_self-help
    ports:
      - "80:80"                                                     # DEV / HTTP
      # - "443:443"                                                 # PROD
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro          # DEV
      # - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro      # PROD
      # - certbot-conf:/etc/letsencrypt:ro                          # PROD
      # - certbot-www:/var/www/certbot:ro                           # PROD
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

  # certbot:                                                        # PROD
  #   image: certbot/certbot                                        # PROD
  #   container_name: certbot_self-help                             # PROD
  #   volumes:                                                      # PROD
  #     - certbot-conf:/etc/letsencrypt                             # PROD
  #     - certbot-www:/var/www/certbot                              # PROD
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  # PROD
  #   restart: unless-stopped                                       # PROD

  backend-init:
    build: ./backend
    container_name: backend_init_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development                                        # DEV
      # - NODE_ENV=production                                       # PROD
      - DATABASE_SSL=false
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/db_wia  # DEV
      # - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}@db:5432/${POSTGRES_DB:-db_wia}  # PROD
      - REDIS_URL=redis://redis:6379                                # DEV
      # - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}@redis:6379  # PROD
      - LLM_SERVICE_URL=http://llm:3001
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run migrate up && npm run seed"             # DEV
    # command: npm run migrate up                                   # PROD
    restart: "no"

  backend:
    build: ./backend
    container_name: backend_app_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development                                        # DEV
      # - NODE_ENV=production                                       # PROD
      - DATABASE_SSL=false
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/db_wia  # DEV
      # - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}@db:5432/${POSTGRES_DB:-db_wia}  # PROD
      - REDIS_URL=redis://redis:6379                                # DEV
      # - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}@redis:6379  # PROD
      - LLM_SERVICE_URL=http://llm:3001
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173      # DEV
      # - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://bordrex.my.id,http://bordrex.my.id}  # PROD
      - APP_BASE_URL=http://localhost                               # DEV
      # - APP_BASE_URL=${APP_BASE_URL:-https://bordrex.my.id}       # PROD
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      backend-init:
        condition: service_completed_successfully
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  llm:
    build: ./llm-service
    container_name: ml_service_self-help
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - NODE_ENV=development                                        # DEV
      # - NODE_ENV=production                                       # PROD
      - ALLOWED_ORIGINS=http://backend:3000,http://localhost:3000   # DEV
      # - ALLOWED_ORIGINS=http://backend:3000                       # PROD
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost/api                     # DEV
        # VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bordrex.my.id/api}  # PROD
        VITE_ENABLE_DEMO_FALLBACK: "false"
    container_name: frontend_app_self-help
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  db:
    image: postgres:17-alpine
    container_name: db_wialmb
    restart: always
    environment:
      POSTGRES_USER: root                                           # DEV
      POSTGRES_PASSWORD: rootpassword                               # DEV
      POSTGRES_DB: db_wia                                           # DEV
      # POSTGRES_USER: ${POSTGRES_USER:-root}                       # PROD
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}  # PROD
      # POSTGRES_DB: ${POSTGRES_DB:-db_wia}                         # PROD
    ports:                                                          # DEV
      - "5433:5432"                                                 # DEV
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d db_wia"]           # DEV
      # test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-root} -d $${POSTGRES_DB:-db_wia}"]  # PROD
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    container_name: redis_wialmb
    restart: always
    command: redis-server                                           # DEV
    # environment:                                                  # PROD
    #   - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}  # PROD
    # command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]  # PROD
    ports:                                                          # DEV
      - "6379:6379"                                                 # DEV
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]          # DEV
      # test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]  # PROD
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  # certbot-conf:                                                   # PROD
  # certbot-www:                                                    # PROD
