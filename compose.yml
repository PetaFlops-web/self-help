services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy_self-help
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

  certbot:
    image: certbot/certbot
    container_name: certbot_self-help
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  backend-init:
    build: ./backend
    container_name: backend_init_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_SSL=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}@db:5432/${POSTGRES_DB:-db_wia}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}@redis:6379
      - LLM_SERVICE_URL=http://llm:3001
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run migrate up
    restart: "no"

  backend:
    build: ./backend
    container_name: backend_app_self-help
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_SSL=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}@db:5432/${POSTGRES_DB:-db_wia}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}@redis:6379
      - LLM_SERVICE_URL=http://llm:3001
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://bordrex.my.id,http://bordrex.my.id}
      - APP_BASE_URL=${APP_BASE_URL:-https://bordrex.my.id}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      backend-init:
        condition: service_completed_successfully
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  llm:
    build: ./llm-service
    container_name: ml_service_self-help
    env_file:
      - ./llm-service/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3001
      - NODE_ENV=production
      - ALLOWED_ORIGINS=http://backend:3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://bordrex.my.id/api}
        VITE_ENABLE_DEMO_FALLBACK: "false"
    container_name: frontend_app_self-help
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  db:
    image: postgres:17-alpine
    container_name: db_wialmb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD harus diset}
      POSTGRES_DB: ${POSTGRES_DB:-db_wia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-db_wia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine
    container_name: redis_wialmb
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD harus diset}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  certbot-conf:
  certbot-www:
