server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: semua route diarahkan ke index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache aset statis hasil Vite (hash di nama file)
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Jangan cache index.html supaya deploy baru langsung terlihat
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
